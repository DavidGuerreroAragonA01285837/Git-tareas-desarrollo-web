<!--Definicion del tipo de documento y lenguaje-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <!--Referencia al documento de css para el estilo de la pagina y el encoding utilizado-->
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <title>Login Page</title>
    </head>
    <!--Se define el body con la clase body_center para ayudar a centrar el menu de login de forma correcta en la pantalla-->
    <body class="body_center">
        <!--Se define la clase login_box para definir el diseno que va a tener el login box-->
        <div class="login_box">
            <!--Se establece un form que te envia a la pagina post-login como su accion ademas de darle clase login para el estilo y un id de form para poder extraer los inputs del usuario-->
            <form action="destination.html" class="login" id="form">
                <!--Se establece la clase stack para organizar los elementos dentro del bloque de login-->
                <div class="stack">
                    Login
                    <!--A los campos de input se les pone el tipo apropiado y el id necesario para poder leer los datos-->
                    <input type="text" id="username" placeholder="Username or e-mail" required>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <!--Se establece el tipo de boton como submit para poder enviar el form-->
                <button type="submit">Submit</button>
            </form>
        </div>
    </body>
    <!--Se define el script necesario para realizar una revision sencilla para el login con un usuario y contrasena definidos-->
    <script>
        const form = document.getElementById("form");
        form.addEventListener("submit",function(e){

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!(username === "Davo995" && password === "Davo995")){
                e.preventDefault();
                alert("The password or the user was incorrect");
            }

        });
    </script>
</html>
