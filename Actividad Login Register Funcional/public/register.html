<!--Definicion del tipo de documento y lenguaje-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <!--Referencia al documento de css para el estilo de la pagina y el encoding utilizado-->
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <title>Register Page</title>
    </head>
    <!--Se define el body con la clase body_center para ayudar a centrar el menu de login de forma correcta en la pantalla-->
    <body class="body_center">
        <!--Se define un div que contiene todos los elementos del header de la pagina-->
        <div class="header">
            <img src="https://images.seeklogo.com/logo-png/33/2/formula-1-logo-png_seeklogo-330361.png" class="F1_logo_white">
        </div>
        <!--Se define la clase login_box para definir el diseno que va a tener el login box-->
        <div class="register_box">
            <!--Se establece un form que te envia a la pagina post-login como su accion ademas de darle clase login para el estilo y un id de form para poder extraer los inputs del usuario-->
            <form class="register" id="register_form">
                <!--Se establece la clase stack para organizar los elementos dentro del bloque de login-->
                <div class="stack">
                    Register
                    <!--A los campos de input se les pone el tipo apropiado y el id necesario para poder leer los datos-->
                    <input type="text" id="name" placeholder="Full Name" required>
                    <input type="email" id="email" placeholder="E-mail" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <input type="password" id="password_confirm" placeholder="Confirm Password" required>
                </div>
                <!--Se establece el tipo de boton como submit para poder enviar el form-->
                <button type="submit">Submit</button>
            </form>
        </div>
        <!--Se define el div para definir el footer de la pagina web con los "links" a las redes sociales de la pagina-->
        <div class="footer">
            <a class="tab_element">Instagram</p>
            <a class="tab_element">Facebook</a>
            <a class="tab_element">Snapshot</a>
        </div>
    </body>
    <!--Script que revisa que el password y la confirmacion del mismo sean iguales para que el registor sea "valido"-->
    <script>
        // Funcion asincrona que manda una solicitud para agregar un usuario al documento de usuarios
        async function register(nombre, email, password){
            const response = await fetch("http://localhost:3000/request/register",{
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nombre: nombre,
                    email: email,
                    password: password
                })
            });

            const data = await response.json();
            console.log(data);

        }

        const form = document.getElementById("register_form");

        // Event listener que detecta cuando el form de registro se ha enviado y en caso de que el registro 
        // sea valido te manda a la pagina los equipos
        form.addEventListener("submit",async function(e){
            e.preventDefault();
            const nombre = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const password_confirm = document.getElementById("password_confirm").value.trim();

            if (password != password_confirm){
                e.preventDefault();
                alert(password, password_confirm)
                alert("Both passwords have to be the same");
            }
            else{

                register(nombre, email, password)
                const token = "abc123";
                const expiration_time = Date.now() + (60 * 1000);
                localStorage.setItem("sessionToken", token);
                localStorage.setItem("tokenExpiration",expiration_time);                
                window.location.href = "/teams-info"
            }

        });
    </script>
</html>
