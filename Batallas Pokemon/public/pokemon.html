<!--Definicion del tipo de documento y lenguaje-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <!--Referencia al documento de css para el estilo de la pagina y el encoding utilizado-->
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <title>Poke-tab!</title>
    </head>
    <!--Se define el body con la clase body_center para ayudar a centrar los elementos correctamente-->
    <body class="body_center">
        <!--Se define un div que contiene todos los elementos del header de la pagina la que te ayuda a moverte entre paginas-->
        <div id="header-container" class="header"></div>
        <!--Se define el titulo con el elemento h1 con la clase titulo para obtener los tamanos y disenos correctos-->
        <h1 class="title">Who is that Pokemon?</h1>
        <!--Se define el segmento de filtros para la pokedex-->
        <div class="pokefilters">
            <input type="text" id="pokeid"  placeholder="Id Pokemon">
            <input type="text" id="pokename"  placeholder="Name">
            <select id="type" class="type-selector">
                <option value="none">Select a type</option>
                <option value="fire">Fire</option>
                <option value="water">Water</option>
                <option value="electric">Electric</option>
                <option value="psychic">Psychic</option>
                <option value="ground">Ground</option>
                <option value="grass">Grass</option>
                <option value="fighting">Fighting</option>
                <option value="rock">Rock</option>
                <option value="dark">Dark</option>
                <option value="bug">Bug</option>
                <option value="dragon">Dragon</option>
                <option value="fairy">Fairy</option>
                <option value="flying">Flying</option>
                <option value="ghost">Ghost</option>
                <option value="ice">Ice</option>
                <option value="normal">Normal</option>
                <option value="poison">Poison</option>
                <option value="steel">Steel</option>
            </select>
            <button onclick="applyFilters()" class="poke_button">Apply filters</button>
        </div>
        <!--Se define un div con la clase center box para establecer la configuracion del contenido-->
        <div class="poke_scroll" id="poke-container"></div>
        <!--Se define un boton que trae mas pokemon de los que hay-->
        <button onclick="addPokemon()" class="poke_button">More Pokemon</button>
        <!--Se define el div para definir el footer de la pagina web con los "links" a las redes sociales de la pagina-->
        <div class="footer" id="footer-container"></div>
    </body>
    <!--Se define el template de la pokecard para poder mandarla llamar en cada instancia de pokemon-->
    <template id="pokecard">
        <div class="card_container">
            <div class="poke_card" id="flipcard">
                <div class="card-front">
                    <div class="poke_title" style="color:white" id="name"></div>
                    <img src="" class="sprite" id="sprite">
                    <div class="horizontal" id="types"></div>
                </div>
                <div class="card-back"> 
                    <div class="stat_container" id="stats">
                        <p class="pokestat" id="hp"></p>
                        <p class="pokestat" id="attack"></p>
                        <p class="pokestat" id="defense"></p>
                        <p class="pokestat" id="spe-attack"></p>
                        <p class="pokestat" id="spe-defense"></p>
                        <p class="pokestat" id="speed"></p>
                    </div>
                    <div class ="move_container" id="moves"></div>
                </div>
            </div>
        </div>
    </template>
    <script>

        // Definicion de variables que almacenan los filtros
        let filterByType ="none";
        let filterByName = "";
        let filterById = 0;

        // Definicion del id o numero de pokemon llamado la ultima ocasion
        let current_id = 1;

        // Variable con el color de cada tipo de pokemon
        const typeColors = {
            normal: "#A8A77A",
            fire: "#EE8130",
            water: "#6390F0",
            electric: "#F7D02C",
            grass: "#7AC74C",
            ice: "#96D9D6",
            fighting: "#C22E28",
            poison: "#A33EA1",
            ground: "#E2BF65",
            flying: "#A98FF3",
            psychic: "#F95587",
            bug: "#A6B91A",
            rock: "#B6A136",
            ghost: "#735797",
            dragon: "#6F35FC",
            dark: "#705746",
            steel: "#B7B7CE",
            fairy: "#D685AD"
        };

        // Segmento que controla el "flipping" de las tarjetas de los pokemon y causa que solo pueda haber uno
        // seleccionado a la vez
        let last;
        document.addEventListener("click", function(e) {
            const card = e.target.closest(".poke_card");
            if (card) {
                if (last && card != last){
                last.classList.remove("flipped");
                }
                card.classList.toggle("flipped");
                last = card;
            }
        });

        // Funcion de logout que elimina el token de sesion y su fecha de caducidad

        function logout(){
            localStorage.removeItem("sessionToken");
            localStorage.removeItem("tokenExpiration");
            localStorage.removeItem("lastPage");
            window.location.href = "/"
        }

        // Fetch del header de las paginas protegidas

        fetch("/inner_header.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("header-container").innerHTML = data;
            document.getElementById("header-container").innerHTML = data;
            document.getElementById("logout").addEventListener("click", function(e){
                e.preventDefault();
                logout();
            })
        })

        // Fetch del footer de la pagina
        fetch("/footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer-container").innerHTML = data;
        })

        // Funcion de agregado de pokemon que manda un fetch al api con los filtros seleccionados como contenido
        async function addPokemon(){
            let cant = 20;
            if (filterById != 0 || filterByName != ""){
                cant = 1;
            }
            let filterData = {};
            let cardstoAdd = [];
            for (let i = 0; i < cant; i++){
                await fetch("/get-pokemon",{
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            numero: current_id,
                            name: filterByName,
                            type: filterByType,
                            id: filterById
                        })
                    })
                .then(response => response.text())
                .then(data =>{
                    // Se construye el objeto de la tarjeta de pokemon usando el template
                    const pokedata = JSON.parse(data);
                    filterData = pokedata;
                    const template = document.getElementById("pokecard");
                    let clone = template.content.cloneNode(true);
                    clone.querySelector("#name").textContent = String("#" + pokedata.id) + " " +String(pokedata.name).toUpperCase();
                    clone.querySelector("#sprite").src = pokedata.image;
                    let type1 = document.createElement("p");
                    type1.classList.add("type_pill")
                    type1.textContent = String(pokedata.types[0]).toUpperCase();
                    type1.style.setProperty("--color", typeColors[pokedata.types[0]]);
                    let type2 = document.createElement("p");
                    type2.classList.add("type_pill")
                    clone.querySelector("#types").appendChild(type1);
                    let card = clone.querySelector(".card_container");
                    card.setAttribute("data-type1", pokedata.types[0]);
                    card.id = String("Pokemon" + pokedata.id);
                    if (pokedata.types.length == 2){
                        type2.textContent = String(pokedata.types[1]).toUpperCase();
                        type2.style.setProperty("--color", typeColors[pokedata.types[1]]);
                        clone.querySelector("#types").appendChild(type2);
                        card.setAttribute("data-type2", pokedata.types[1]);
                    }
                    clone.querySelector("#hp").textContent = "HP: " + pokedata.stats.hp;
                    clone.querySelector("#attack").textContent = "ATT: " + pokedata.stats.attack;
                    clone.querySelector("#defense").textContent = "DEF: " + pokedata.stats.defense;
                    clone.querySelector("#spe-attack").textContent = "SPE-ATT: " + pokedata.stats.spe_attack;
                    clone.querySelector("#spe-defense").textContent = "SPE-DEF: " + pokedata.stats.spe_defense;
                    clone.querySelector("#speed").textContent = "SPE: " + pokedata.stats.speed;
                    const moves = [];
                    moves.push(document.createElement("p"));
                    moves.push(document.createElement("p"));
                    moves.push(document.createElement("p"));
                    moves.push(document.createElement("p"));
                    for (let i = 0; i < 4 && i < pokedata.moves.length; i++){
                        if (pokedata.moves[i]){
                            moves[i].classList.add("move_pill");
                            moves[i].textContent = String(pokedata.moves[i].name).toUpperCase();
                            moves[i].style.setProperty("--color", typeColors[pokedata.moves[i].type])
                            clone.querySelector("#moves").appendChild(moves[i]);
                        }
                    }
                    if (filterByType != "none"){
                        let isCorrectType = false;
                        for (let i = 0; i < filterData.types.length; i++){
                            if (filterByType == filterData.types[i]){
                                isCorrectType = true;
                            }
                        }
                        if (!isCorrectType){
                            i--;
                        }
                        else{
                            cardstoAdd.push(clone);
                        }
                    }
                    else if (filterByName != ""){
                        if (filterByName == filterData.name){
                            cardstoAdd.push(clone);
                        }
                        else {
                            i--;
                        }
                        
                    }
                    else if (filterById != 0){
                        if (filterById == filterData.id){
                            cardstoAdd.push(clone);
                        }
                        else {
                            i--;
                        }
                        
                    }
                    else{
                        cardstoAdd.push(clone);
                    }
                })
                current_id ++;
            }
            let fragment = document.createDocumentFragment();
            cardstoAdd.forEach(element => {
                fragment.appendChild(element);
            });
            document.getElementById("poke-container").appendChild(fragment);
            orderbyID();
        }

        // Funcion que guarda en las variables de filtro los filtros seleccionados y reinicia los indices de
        // pokemon
        async function applyFilters(){
            current_id = 1;
            document.getElementById("poke-container").textContent = "";
            filterById = document.getElementById("pokeid").value.trim();
            filterByType = document.getElementById("type").value.trim();
            filterByName = document.getElementById("pokename").value.trim();
            addPokemon();

        }

        // Funcion que se ejecuta en cada llamada de pokemon para ordenar los pokemon en orden por id
        function orderbyID(){
            const container = document.getElementById("poke-container");

            let cards = Array.from(container.children);

            cards.sort((a,b) =>
            parseInt(a.id.replace("Pokemon","")) -
            parseInt(b.id.replace("Pokemon","")));

            cards.forEach(card => container.appendChild(card));
        }

        // Llamado inicial de agregar pokemon para que no aparezca vacio inicialmente
        addPokemon();

        // Se agrego un script para revisar si el token de sesion generado sigue activo y en caso de que no
        // lo sea se regresa a la pagina de login y se borra el token y la hora de vencimiento
        const active_token = localStorage.getItem("sessionToken");
        const expiration_time_active_token = localStorage.getItem("tokenExpiration");

        if (!active_token || !expiration_time_active_token || expiration_time_active_token < Date.now()){
            localStorage.removeItem("sessionToken");
            localStorage.removeItem("tokenExpiration");
            localStorage.setItem("lastPage","/poke-tab");
            window.location.href = "/"
        }


    </script>
</html>
